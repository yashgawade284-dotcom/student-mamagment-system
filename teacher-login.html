<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Student Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* Teacher Login Specific Styles */
        .login-container.teacher {
            background: linear-gradient(135deg, #0f172a 0%, #14532d 100%);
        }
        
        .login-box.teacher {
            border-top: 4px solid #22c55e;
        }
        
        .login-logo.teacher i {
            color: #22c55e;
            font-size: 52px;
        }
        
        .login-logo.teacher h1 {
            color: #22c55e;
        }
        
        .btn-teacher {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        
        .btn-teacher:hover {
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }
        
        .login-links a {
            color: #22c55e;
        }
        
        .login-links a:hover {
            color: #4ade80;
        }
        
        .form-group input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }
        
        .input-icon {
            color: #22c55e;
        }
    </style>
</head>
<body>
    <div class="login-container teacher">
        <div class="login-box teacher">
            <div class="login-logo teacher">
                <i class="fas fa-chalkboard-teacher"></i>
                <h1>Teacher Login</h1>
                <p>Manage your classes and students</p>
            </div>
            
            <div id="alertBox" class="alert"></div>
            
            <form id="teacherLoginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user input-icon"></i> Teacher ID or Email
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter your teacher ID or email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock input-icon"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-teacher">
                    <i class="fas fa-sign-in-alt"></i>
                    Login as Teacher
                </button>
            </form>
            
            <div class="login-links">
                <p>Are you a <a href="student-login.html">Student</a> or <a href="admin-login.html">Admin</a>?</p>
            </div>
            
            <div class="demo-credentials">
                <p><i class="fas fa-info-circle"></i> Demo: teacher1 / teacher123</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Teacher login form handler
        document.getElementById('teacherLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await login(username, password);
        });
    </script>
</body>
</html>
