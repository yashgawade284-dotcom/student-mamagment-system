<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Student Management System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* Admin Login Specific Styles */
        .login-container.admin {
            background: linear-gradient(135deg, #0f172a 0%, #581c87 100%);
        }
        
        .login-box.admin {
            border-top: 4px solid #a855f7;
        }
        
        .login-logo.admin i {
            color: #a855f7;
            font-size: 52px;
        }
        
        .login-logo.admin h1 {
            color: #a855f7;
        }
        
        .btn-admin {
            background: linear-gradient(135deg, #a855f7, #7c3aed);
        }
        
        .btn-admin:hover {
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.4);
        }
        
        .login-links a {
            color: #a855f7;
        }
        
        .login-links a:hover {
            color: #c084fc;
        }
        
        .form-group input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.2);
        }
        
        .input-icon {
            color: #a855f7;
        }
        
        .security-notice {
            margin-top: 20px;
            padding: 12px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #c084fc;
            text-align: center;
        }
        
        .security-notice i {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div class="login-container admin">
    <div class="login-box admin">
            <div class="login-logo admin">
                <i class="fas fa-shield-alt"></i>
                <h1>Administrator Login</h1>
                <p>System Management Portal</p>
            </div>
            
            <div id="alertBox" class="alert"></div>
            
            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user-shield input-icon"></i> Admin Username
                    </label>
                    <input type="text" id="username" name="username" placeholder="Enter admin username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock input-icon"></i> Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-admin">
                    <i class="fas fa-sign-in-alt"></i>
                    Login as Admin
                </button>
            </form>
            
            <div class="login-links">
                <p>Are you a <a href="student-login.html">Student</a> or <a href="teacher-login.html">Teacher</a>?</p>
            </div>
            
            <div class="security-notice">
                <i class="fas fa-exclamation-triangle"></i>
                This is a restricted area. Unauthorized access is prohibited.
            </div>
            
            <div class="demo-credentials">
                <p><i class="fas fa-info-circle"></i> Demo: admin / admin123</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Admin login form handler
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            await login(username, password);
        });
    </script>
</body>
</html>
